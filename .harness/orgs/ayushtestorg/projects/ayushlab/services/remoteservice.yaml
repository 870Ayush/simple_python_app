service:
  name: remote-service
  identifier: remoteservice
  orgIdentifier: ayushtestorg
  projectIdentifier: ayushlab
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: manifest
            type: K8sManifest
            spec:
              store:
                type: Harness
                spec:
                  files:
                    - /K8s-test-manifest
              valuesPaths:
                - /values.yaml
              optionalValuesYaml: false
              skipResourceVersioning: false
              enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: dockerk8stest
                imagePath: library/python
                tag: <+input>
                digest: ""
              identifier: remoteArtifact
              type: DockerRegistry
      variables:
        - name: college
          type: String
          description: ""
          required: false
          value: KIIT
        - name: city
          type: String
          description: ""
          required: false
          value: bengaluru
    type: Kubernetes
