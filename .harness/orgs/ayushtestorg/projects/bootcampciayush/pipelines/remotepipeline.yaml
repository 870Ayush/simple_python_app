pipeline:
  name: remote-pipeline
  identifier: remotepipeline
  projectIdentifier: bootcampciayush
  orgIdentifier: ayushtestorg
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github870Ayush
        repoName: simple_python_app
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: buildinfra
              namespace: default
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: ayushdockerconnector
                    repo: 22ayush22/personal-repo
                    tags: <+input>
