pipeline:
  name: chianed-pipeline
  identifier: chianedpipeline
  projectIdentifier: ayushlab
  orgIdentifier: ayushtestorg
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Ayush
        repoName: simple_python_app
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8stestconnector
              namespace: default
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: dockerk8stest
                    image: library/nginx
                    shell: Bash
                    command: pwd
