pipeline:
  name: chained-pipeline
  identifier: chianedpipeline
  projectIdentifier: ayushlab
  orgIdentifier: ayushtestorg
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Ayush
        repoName: simple_python_app
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8stestconnector
              namespace: default
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: dockerk8stest
                    image: library/nginx
                    shell: Bash
                    command: pwd
    - stage:
        name: chained-deploy
        identifier: chaineddeploy
        description: ""
        type: Pipeline
        spec:
          org: ayushtestorg
          project: ayushlab
          pipeline: nativehelm
          inputs:
            identifier: ayushcanary
            stages:
              - stage:
                  identifier: deploycanary
                  type: Deployment
                  spec:
                    service:
                      serviceInputs:
                        serviceDefinition:
                          type: Kubernetes
                          spec:
                            artifacts:
                              primary:
                                primaryArtifactRef: <+input>
                                sources: <+input>
          outputs: []
